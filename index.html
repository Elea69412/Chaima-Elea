<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Le Serpent</title>
  <style>
    :root { --bg: #0f172a; --fg: #f8fafc; --muted: #94a3b8; --serpent: #22c55e; --pomme: #f43f5e; --grille: #1e293b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif; user-select: none;
      display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px;
      touch-action: none;
    }
    header { display: flex; justify-content: space-between; width: 100%; max-width: 480px; font-size: 18px; font-weight: 600; }
    #cadre { position: relative; width: 100%; max-width: 480px; aspect-ratio: 1; }
    canvas { width: 100%; height: 100%; border-radius: 12px; background: var(--grille); display: block; }
    #ecran {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 16px; background: rgba(15, 23, 42, .85); border-radius: 12px;
    }
    #pouvoir { min-height: 1.2em; }
    .legende { display: grid; grid-template-columns: auto auto; gap: 4px 10px; text-align: left; font-size: 14px; color: var(--muted); }
    .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    h1 { margin: 0; font-size: 36px; }
    p { margin: 0; color: var(--muted); }
    button {
      font: inherit; font-weight: 700; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--serpent); color: #052e16; font-size: 20px; padding: 14px 32px;
    }
    #croix { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
    #croix button { border-radius: 14px; padding: 0; font-size: 24px; background: var(--grille); color: var(--fg); }
    #croix [data-dir="haut"] { grid-column: 2; }
    #croix [data-dir="gauche"] { grid-column: 1; grid-row: 2; }
    #croix [data-dir="bas"] { grid-column: 2; grid-row: 2; }
    #croix [data-dir="droite"] { grid-column: 3; grid-row: 2; }
    @media (hover: hover) and (pointer: fine) { #croix { display: none; } }
  </style>
</head>
<body>
  <header>
    <span>Score : <span id="score">0</span></span>
    <span id="pouvoir"></span>
    <span>Record : <span id="record">0</span></span>
  </header>
  <div id="cadre">
    <canvas id="jeu" width="400" height="400"></canvas>
    <div id="ecran">
      <h1>🐍 Le Serpent</h1>
      <p>Mange les pommes sans te cogner<br>contre les murs ni les rochers.<br>Flèches du clavier, ou glisse le doigt sur mobile.</p>
      <div class="legende">
        <span><i style="background:#facc15"></i>Dorée : +3 points</span>
        <span><i style="background:#38bdf8"></i>Glacée : ralentit</span>
        <span><i style="background:#c084fc"></i>Fantôme : traverse tout</span>
        <span><i style="background:#4ade80"></i>Mini : raccourcit</span>
      </div>
      <button id="jouer">Jouer</button>
    </div>
  </div>
  <div id="croix">
    <button data-dir="haut" aria-label="Haut">▲</button>
    <button data-dir="gauche" aria-label="Gauche">◀</button>
    <button data-dir="bas" aria-label="Bas">▼</button>
    <button data-dir="droite" aria-label="Droite">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('jeu');
    const ctx = canvas.getContext('2d');
    const ecran = document.getElementById('ecran');
    const scoreEl = document.getElementById('score');
    const recordEl = document.getElementById('record');
    const pouvoirEl = document.getElementById('pouvoir');

    const CASES = 20;
    const T = canvas.width / CASES; // taille d'une case en pixels
    const DIRS = { haut: [0, -1], bas: [0, 1], gauche: [-1, 0], droite: [1, 0] };

    let serpent, dir, fileDirs, pomme, superPomme, pouvoir, obstacles, score, boucle, enJeu = false;
    let record = 0;
    try { record = Number(localStorage.getItem('record-serpent')) || 0; } catch (e) {}
    recordEl.textContent = record;

    const OBSTACLES_DEPART = 6;
    const POMMES_PAR_OBSTACLE = 5; // un rocher de plus toutes les 5 pommes

    // Pommes à super pouvoir : elles apparaissent parfois et disparaissent si on tarde trop.
    // Les durées sont comptées en tours de jeu (un tour = un déplacement du serpent).
    const SUPER_POMMES = {
      or:      { couleur: '#facc15', nom: '⭐ +3 points' },
      glace:   { couleur: '#38bdf8', nom: '❄️ Ralenti', duree: 40 },
      fantome: { couleur: '#c084fc', nom: '👻 Fantôme', duree: 40 },
      mini:    { couleur: '#4ade80', nom: '✂️ Raccourci' },
    };
    const CHANCE_SUPER_POMME = 0.35; // après chaque pomme normale
    const VIE_SUPER_POMME = 45;

    const occupe = (liste, p) => liste.some(s => s.x === p.x && s.y === p.y);
    const surCase = (a, b) => a && b && a.x === b.x && a.y === b.y;

    function caseAuHasard() {
      return { x: Math.floor(Math.random() * CASES), y: Math.floor(Math.random() * CASES) };
    }

    function nouvellePomme() {
      let p;
      do { p = caseAuHasard(); } while (
        occupe(serpent, p) || occupe(obstacles, p) || surCase(p, pomme) || surCase(p, superPomme)
      );
      return p;
    }

    function nouvelleSuperPomme() {
      const types = Object.keys(SUPER_POMMES);
      superPomme = {
        ...nouvellePomme(),
        type: types[Math.floor(Math.random() * types.length)],
        vie: VIE_SUPER_POMME,
      };
    }

    // Ajoute des points et pose un rocher à chaque palier de 5 franchi
    function ajouterPoints(n) {
      const avant = score;
      score += n;
      scoreEl.textContent = score;
      const paliers = Math.floor(score / POMMES_PAR_OBSTACLE) - Math.floor(avant / POMMES_PAR_OBSTACLE);
      for (let i = 0; i < paliers; i++) nouvelObstacle();
    }

    function activer(type) {
      if (type === 'or') ajouterPoints(3);
      if (type === 'mini') serpent.length = Math.max(2, serpent.length - 4);
      const duree = SUPER_POMMES[type].duree;
      // Un effet immédiat s'affiche brièvement, sans couper un pouvoir encore actif
      if (!duree && pouvoir && SUPER_POMMES[pouvoir.type].duree) return;
      pouvoir = { type, tours: duree || 12 };
      afficherPouvoir(type);
    }

    function afficherPouvoir(type) {
      pouvoirEl.textContent = type ? SUPER_POMMES[type].nom : '';
      pouvoirEl.style.color = type ? SUPER_POMMES[type].couleur : '';
    }

    // Un rocher n'apparaît jamais sur le serpent, la pomme, près de la tête, ni juste devant elle
    function devantLaTete(p) {
      const tete = serpent[0];
      for (let k = 1; k <= 8; k++) {
        if (p.x === tete.x + dir[0] * k && p.y === tete.y + dir[1] * k) return true;
      }
      return false;
    }

    function nouvelObstacle() {
      const tete = serpent[0];
      let p;
      do { p = caseAuHasard(); } while (
        occupe(serpent, p) || occupe(obstacles, p) || surCase(p, pomme) || surCase(p, superPomme) ||
        Math.abs(p.x - tete.x) + Math.abs(p.y - tete.y) < 4 || devantLaTete(p)
      );
      obstacles.push(p);
    }

    function demarrer() {
      serpent = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = DIRS.droite;
      fileDirs = [];
      obstacles = [];
      pomme = null;
      superPomme = null;
      pouvoir = null;
      afficherPouvoir(null);
      for (let i = 0; i < OBSTACLES_DEPART; i++) nouvelObstacle();
      pomme = nouvellePomme();
      score = 0;
      scoreEl.textContent = score;
      ecran.style.display = 'none';
      enJeu = true;
      planifier();
    }

    // Le serpent accélère au fur et à mesure des pommes mangées
    function planifier() {
      clearTimeout(boucle);
      const ralenti = pouvoir && pouvoir.type === 'glace' ? 100 : 0;
      boucle = setTimeout(tour, Math.max(100, 200 - score * 2) + ralenti);
    }

    function tour() {
      if (fileDirs.length) dir = fileDirs.shift();
      const tete = { x: serpent[0].x + dir[0], y: serpent[0].y + dir[1] };

      const horsGrille = tete.x < 0 || tete.y < 0 || tete.x >= CASES || tete.y >= CASES;
      const surLuiMeme = serpent.slice(0, -1).some(s => s.x === tete.x && s.y === tete.y);
      const fantome = pouvoir && pouvoir.type === 'fantome'; // traverse les rochers et son propre corps
      if (horsGrille || (!fantome && (surLuiMeme || occupe(obstacles, tete)))) return perdu();

      serpent.unshift(tete);
      if (surCase(tete, pomme)) {
        ajouterPoints(1);
        pomme = nouvellePomme();
        if (!superPomme && Math.random() < CHANCE_SUPER_POMME) nouvelleSuperPomme();
      } else {
        serpent.pop();
      }

      if (surCase(tete, superPomme)) {
        const type = superPomme.type;
        superPomme = null;
        activer(type);
      } else if (superPomme && --superPomme.vie <= 0) {
        superPomme = null;
      }

      if (pouvoir && --pouvoir.tours <= 0) {
        pouvoir = null;
        afficherPouvoir(null);
      }
      dessiner();
      planifier();
    }

    function dessiner() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#64748b';
      obstacles.forEach(o => {
        ctx.beginPath();
        ctx.roundRect(o.x * T + 1, o.y * T + 1, T - 2, T - 2, 3);
        ctx.fill();
      });
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(pomme.x * T + T / 2, pomme.y * T + T / 2, T / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      // La super pomme a un halo blanc et clignote quand elle va bientôt disparaître
      if (superPomme && (superPomme.vie > 12 || superPomme.vie % 2)) {
        const cx = superPomme.x * T + T / 2, cy = superPomme.y * T + T / 2;
        ctx.fillStyle = SUPER_POMMES[superPomme.type].couleur;
        ctx.beginPath();
        ctx.arc(cx, cy, T / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      // Le serpent devient transparent en mode fantôme, et clignote juste avant la fin
      const fantome = pouvoir && pouvoir.type === 'fantome';
      ctx.globalAlpha = fantome ? (pouvoir.tours > 8 || pouvoir.tours % 2 ? 0.45 : 0.85) : 1;
      serpent.forEach((s, i) => {
        // Arc-en-ciel : chaque anneau décale la teinte de 30°, la tête est plus claire
        ctx.fillStyle = `hsl(${(i * 30) % 360}, 85%, ${i === 0 ? 70 : 55}%)`;
        ctx.beginPath();
        ctx.roundRect(s.x * T + 1, s.y * T + 1, T - 2, T - 2, 5);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function perdu() {
      enJeu = false;
      clearTimeout(boucle);
      afficherPouvoir(null);
      const nouveau = score > record;
      if (nouveau) {
        record = score;
        recordEl.textContent = record;
        try { localStorage.setItem('record-serpent', record); } catch (e) {}
      }
      ecran.innerHTML = `
        <h1>${nouveau ? '🏆 Nouveau record !' : 'Perdu !'}</h1>
        <p>Tu as mangé ${score} pomme${score > 1 ? 's' : ''}.</p>
        <button id="rejouer">Rejouer</button>`;
      ecran.style.display = 'flex';
      document.getElementById('rejouer').onclick = demarrer;
    }

    // Les changements de direction sont mis en file pour ne pas pouvoir faire demi-tour
    function tourner(nom) {
      if (!enJeu) return;
      const d = DIRS[nom];
      const derniere = fileDirs[fileDirs.length - 1] || dir;
      if (d[0] === -derniere[0] && d[1] === -derniere[1]) return;
      if (d === derniere || fileDirs.length >= 2) return;
      fileDirs.push(d);
    }

    const TOUCHES = {
      ArrowUp: 'haut', ArrowDown: 'bas', ArrowLeft: 'gauche', ArrowRight: 'droite',
      z: 'haut', s: 'bas', q: 'gauche', d: 'droite', w: 'haut', a: 'gauche'
    };
    document.addEventListener('keydown', e => {
      if (!enJeu && (e.key === ' ' || e.key === 'Enter')) return demarrer();
      const nom = TOUCHES[e.key];
      if (nom) { e.preventDefault(); tourner(nom); }
    });

    let depart = null;
    document.addEventListener('touchstart', e => { depart = e.touches[0]; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!depart) return;
      const fin = e.changedTouches[0];
      const dx = fin.clientX - depart.clientX, dy = fin.clientY - depart.clientY;
      depart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      tourner(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'droite' : 'gauche') : (dy > 0 ? 'bas' : 'haut'));
    });

    document.querySelectorAll('#croix button').forEach(b =>
      b.addEventListener('pointerdown', e => { e.preventDefault(); tourner(b.dataset.dir); })
    );
    document.getElementById('jouer').onclick = demarrer;
  </script>
</body>
</html>
